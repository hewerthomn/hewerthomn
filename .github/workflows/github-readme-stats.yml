name: Update GitHub README Stats

on:
  schedule:
    - cron: "0 3 * * *"

  workflow_dispatch:

jobs:
  generate-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate GitHub stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: >-
            username=hewerthomn
            &show_icons=true
            &include_all_commits=true
            &count_private=true
            &theme=vue
          path: profile/stats.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Generate top languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: >-
            username=hewerthomn
            &layout=compact
            &langs_count=8
            &theme=vue
            &hide=css,html,javascript
          path: profile/top-langs.svg
          token: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit generated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/*.svg

          git diff --cached --quiet && exit 0

          git commit -m "chore: update GitHub stats"
          git push
